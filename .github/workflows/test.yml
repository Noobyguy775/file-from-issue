name: Create PR from issue

on:
  issues:
    types: [opened]

jobs:
  create_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.1

      - name: Generate File from Issue
        uses: ./ # Uses an action in the root directory

      - name: Create new branch
        run: |
          echo "Creating new branch"
          BRANCH=pattern/${{ github.event.issue.user.login }}-${{ github.event.issue.title }}-${{ github.event.issue.number }}
          git checkout main
          git pull origin main
          git checkout -b $BRANCH
          echo "created + checked out branch '$BRANCH'"

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Add pattern ${{ github.event.issue.title }}'
          labels: 'new pattern'
          body: |
            This Pull Request was automatically created from data provided in #${{ github.event.issue.number }}.

            To add this pattern to the repository, merge it!

            closes #${{ github.event.issue.number }}
          base: 'main'
